{% extends "base.html" %}
{% block content %}
<h1>הצטרפות</h1>
<p>הוזמנת עם הכתובת <bdi dir="ltr">{{ email }}</bdi>.</p>
<form method="post" class="card stack">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>שם מלא (יופיע בבקשות) <input name="full_name" required autocomplete="name"></label>
  <label>סיסמה (8 תווים לפחות) <input type="password" name="password" minlength="8" required autocomplete="new-password" dir="ltr"></label>
  <button class="primary">הצטרפות</button>
</form>
{% endblock %}
