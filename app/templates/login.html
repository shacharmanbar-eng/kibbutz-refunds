{% extends "base.html" %}
{% block content %}
<h1>כניסה</h1>
<form method="post" class="card stack">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>מייל <input type="email" name="email" required autocomplete="email" dir="ltr"></label>
  <label>סיסמה <input type="password" name="password" required autocomplete="current-password" dir="ltr"></label>
  <button class="primary">כניסה</button>
</form>
<p class="muted">הכניסה למוזמנים בלבד.</p>
{% endblock %}
